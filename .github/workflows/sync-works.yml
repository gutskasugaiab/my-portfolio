name: Sync designer works

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/img/designers/**'
      - 'portfolio/works/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync designer-works.json from images and LP folders
        run: node scripts/sync-works.js

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/data/designer-works.json
          git diff --cached --quiet || git commit -m "chore: sync designer-works.json from images and LP folders"
          git push
