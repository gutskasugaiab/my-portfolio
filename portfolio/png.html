<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人デザイン — GUTS × Xeno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --amber: #EF9F27;
            --amber-light: #FAC775;
            --amber-pale: #FAEEDA;
            --coral: #D85A30;
            --coral-pale: #FAECE7;
            --pink: #D4537E;
            --pink-pale: #FBEAF0;
            --teal: #1D9E75;
            --teal-pale: #E1F5EE;
            --purple: #7F77DD;
            --purple-pale: #EEEDFE;
            --blue: #378ADD;
            --blue-pale: #E6F1FB;
            --green: #639922;
            --green-pale: #EAF3DE;
            --gray-100: #F7F6F3;
            --gray-200: #EEEDE8;
            --gray-700: #444441;
            --text: #1a1a18;
            --text-muted: #6b6a65;
            --border: rgba(0, 0, 0, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-pill: 999px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text);
            background: var(--gray-100);
            min-height: 100vh;
        }

        /* ── Nav ── */
        body>nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(247, 246, 243, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 0.5px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color .15s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        .nav-links a.active {
            border-bottom: 2px solid var(--amber);
            padding-bottom: 2px;
        }

        /* ── Container ── */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ── Page header ── */
        .page-header {
            padding: 3rem 0 2rem;
            border-bottom: 0.5px solid var(--border);
            margin-bottom: 2.5rem;
        }

        .page-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 0.35rem;
        }

        .page-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ── Filter ── */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 2rem;
        }

        .filter-btn {
            font-size: 13px;
            font-weight: 500;
            font-family: 'Noto Sans JP', sans-serif;
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            border: 0.5px solid var(--border);
            background: white;
            color: var(--text-muted);
            cursor: pointer;
            transition: all .15s;
        }

        .filter-btn:hover {
            color: var(--text);
            border-color: rgba(0, 0, 0, 0.25);
        }

        .filter-btn.active {
            background: var(--text);
            color: white;
            border-color: var(--text);
        }

        /* ── Gallery ── */
        .gallery {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery-item {
            display: block;
            width: 100%;
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: white;
            border: 0.5px solid var(--border);
            cursor: pointer;
            transition: transform .18s, box-shadow .18s;
        }

        .gallery-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            display: block;
        }

        .item-body {
            padding: 0.75rem 1rem 0.875rem;
        }

        .item-tag {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 99px;
            display: inline-block;
            margin-bottom: 5px;
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 3px;
        }

        .item-desc {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* ── Lightbox ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 8, 0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .lightbox.open {
            display: flex;
        }

        .lightbox-inner {
            background: white;
            border-radius: var(--radius-lg);
            max-width: 720px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .lightbox-img {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            min-height: 340px;
        }

        .lightbox-img img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .lightbox-body {
            padding: 1.25rem 1.5rem 1.5rem;
            border-top: 0.5px solid var(--border);
        }

        .lightbox-body h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .lightbox-body p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            transition: background .15s;
        }

        .lightbox-close:hover {
            background: rgba(0, 0, 0, 0.35);
        }

        /* ── Contact ── */
        .container {
            margin: 20px auto;
        }

        .contact-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-top: 0.5rem;
        }

        .contact-card {
            background: white;
            border: 0.5px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem 1.375rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-card-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .contact-card-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .contact-card-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            word-break: break-all;
        }

        .contact-card-value:hover {
            text-decoration: underline;
        }

        .contact-note {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 1.25rem;
        }

        /* ── Footer ── */
        footer {
            background: white;
            border-top: 0.5px solid var(--border);
            padding: 2rem 1.5rem;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2rem;
        }

        /* ── ハンバーガー ── */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius-sm);
            transition: background .15s;
        }

        .hamburger:hover {
            background: var(--gray-200);
        }

        .hamburger span {
            display: block;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform-origin: center;
        }

        .hamburger.is-open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburger.is-open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.is-open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* ── ドロワー ── */
        .drawer {
            position: fixed;
            top: 56px;
            right: 0;
            bottom: 0;
            width: min(280px, 80vw);
            background: white;
            z-index: 150;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            border-left: 0.5px solid var(--border);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.08);
        }

        .drawer.is-open {
            transform: translateX(0);
        }

        .drawer__nav {
            display: flex;
            flex-direction: column;
        }

        .drawer__link:first-child {
            border-top: 0.5px solid var(--border);
        }

        .drawer__link {
            padding: 0.875rem 1.5rem;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-bottom: 0.5px solid var(--border);
            transition: color .15s, background .15s;
        }

        .drawer__link:hover {
            color: var(--text);
            background: var(--gray-100);
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 140;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.is-open {
            opacity: 1;
            pointer-events: auto;
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            nav {
                padding: 0 1rem;
            }

            .nav-links {
                display: none;
            }

            .hamburger {
                display: flex;
            }

            .page-header h1 {
                font-size: 22px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }

        /* ── Designer cards ── */
        .designer-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .designer-card {
            display: block;
            text-decoration: none;
            color: inherit;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: white;
            border: 0.5px solid var(--border);
            transition: transform .18s, box-shadow .18s;
            text-align: center;
            padding: 2rem 1rem 1.5rem;
        }

        .designer-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);
        }

        .designer-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 1rem;
            display: block;
            background: var(--gray-200);
        }

        .designer-avatar-fallback {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--teal-pale);
            color: #0F6E56;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
        }

        .designer-name {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .designer-role {
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            .designer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="nav-logo">GUTS × Xeno</a>
        <ul class="nav-links">
            <li><a href="index.html">トップ</a></li>
            <li><a href="png.html" class="active">個人デザイン</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="メニューを開く" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <div class="drawer" id="drawer" aria-hidden="true">
        <nav class="drawer__nav">
            <a href="index.html" class="drawer__link">トップ</a>
            <a href="png.html" class="drawer__link active">個人デザイン</a>
        </nav>
    </div>
    <div class="drawer-overlay" id="drawerOverlay"></div>

    <div class="container">

        <div class="page-header">
            <h1>個人デザイン</h1>
            <p>所属クリエイターのポートフォリオ</p>
        </div>

        <div class="designer-grid" id="designerGrid">
            <p class="gallery-loading" style="padding:2rem 0;color:var(--text-muted);grid-column:1/-1">読み込み中...</p>
        </div>

    </div>

    <section id="contact">
        <div class="container">
            <div class="sec-label"><i class="ti ti-mail"></i>お問い合わせ</div>
            <p class="contact-note">お仕事のご依頼・コラボレーションのご提案など、お気軽にご連絡ください。</p>
            <div class="contact-cards">
                <div class="contact-card">
                    <div class="contact-card-icon" style="background:var(--amber-pale);color:#854F0B"><i
                            class="ti ti-mail"></i></div>
                    <div class="contact-card-label">メール</div>
                    <a href="mailto:guts.kasugai@gmail.com" class="contact-card-value">guts.kasugai@gmail.com</a>
                </div>
                <div class="contact-card">
                    <div class="contact-card-icon" style="background:var(--teal-pale);color:#0F6E56"><i
                            class="ti ti-phone"></i></div>
                    <div class="contact-card-label">電話</div>
                    <a href="tel:0568-20-1111" class="contact-card-value">0568-20-1111</a>
                </div>
                <div class="contact-card">
                    <div class="contact-card-icon" style="background:var(--pink-pale);color:#72243E"><i
                            class="ti ti-map-pin"></i></div>
                    <div class="contact-card-label">所在地</div>
                    <span class="contact-card-value" style="cursor:default">愛知県春日井市六軒屋町6-146KANBEビル1階</span>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2025 GUTS × Xeno. All rights reserved.</p>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const drawer = document.getElementById('drawer');
        const overlay = document.getElementById('drawerOverlay');

        function openDrawer() {
            hamburger.classList.add('is-open');
            drawer.classList.add('is-open');
            overlay.classList.add('is-open');
            hamburger.setAttribute('aria-expanded', 'true');
            drawer.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeDrawer() {
            hamburger.classList.remove('is-open');
            drawer.classList.remove('is-open');
            overlay.classList.remove('is-open');
            hamburger.setAttribute('aria-expanded', 'false');
            drawer.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        hamburger.addEventListener('click', () => {
            hamburger.classList.contains('is-open') ? closeDrawer() : openDrawer();
        });

        overlay.addEventListener('click', closeDrawer);

        drawer.querySelectorAll('.drawer__link').forEach(link => {
            link.addEventListener('click', closeDrawer);
        });

        // ── data/designers.jsonからデザイナー一覧を取得（CMS不要・GitHubにpushするだけで反映）
        async function fetchDesigners() {
            const res = await fetch('data/designers.json');
            if (!res.ok) throw new Error('designers.json fetch failed: ' + res.status);
            const data = await res.json();
            return (data || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
        }

        // ── デザイナーカードを描画
        function renderDesigners(designers) {
            const grid = document.getElementById('designerGrid');
            grid.innerHTML = '';

            if (designers.length === 0) {
                grid.innerHTML = '<p style="padding:2rem 0;color:var(--text-muted);grid-column:1/-1">まだ登録されていません。</p>';
                return;
            }

            designers.forEach(d => {
                const a = document.createElement('a');
                a.className = 'designer-card';
                a.href = `designer.html?slug=${encodeURIComponent(d.slug)}`;

                const avatarHtml = d.avatar
                    ? `<img class="designer-avatar" src="${d.avatar}" alt="${d.name}">`
                    : `<div class="designer-avatar-fallback">${(d.name || '?').charAt(0)}</div>`;

                a.innerHTML = `
                    ${avatarHtml}
                    <div class="designer-name">${d.name}</div>
                    ${d.role ? `<div class="designer-role">${d.role}</div>` : ''}
                `;
                grid.appendChild(a);
            });
        }

        // ── 初期化：data/designers.jsonから取得して描画
        async function initDesigners() {
            const grid = document.getElementById('designerGrid');
            try {
                const designers = await fetchDesigners();
                renderDesigners(designers);
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<p style="padding:2rem 0;color:var(--text-muted);grid-column:1/-1">読み込みに失敗しました。時間を置いて再読み込みしてください。</p>';
            }
        }
        initDesigners();
    </script>
</body>

</html>
